name: Windows Production Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        # Python 3.10 is chosen because it has guaranteed pre-built wheels
        # for MediaPipe and OpenCV on Windows, whereas 3.12+ might face issues.

    - name: Upgrade PIP
      run: python -m pip install --upgrade pip

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Run Syntax Checks
      run: |
        python -m py_compile main.py
        python -m py_compile config.py
        python -c "import compileall; compileall.compile_dir('.', force=True, quiet=1)"

    - name: Run Import Checks
      run: |
        python -c "import cv2, mediapipe, pyautogui, numpy, PIL; print('All heavy dependencies imported successfully.')"

    - name: Validate Spec File Exists
      run: |
        if (!(Test-Path "./AI-Gesture-Controller.spec")) {
            Write-Error "PyInstaller spec file is missing"
            Get-ChildItem -Recurse -File | Select-Object FullName
            exit 1
        }

    - name: Build Windows Executable
      run: python -m PyInstaller ./AI-Gesture-Controller.spec --clean

    - name: Verify Output Exists
      run: |
        if (Test-Path "dist\AI-Gesture-Controller\AI-Gesture-Controller.exe") {
            Write-Host "Executable successfully built!"
        } else {
            Write-Error "Executable not found in dist folder!"
            exit 1
        }

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AI-Gesture-Controller-Windows
        path: dist/AI-Gesture-Controller/
        if-no-files-found: error
